apiVersion: apps/v1
kind: Deployment
metadata:
  name: estim-web
  namespace: estim-production
  labels:
    app: estim-web
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: estim-web
  template:
    metadata:
      labels:
        app: estim-web
        tier: frontend
        version: v1
    spec:
      containers:
        - name: estim-web
          image: ghcr.io/tabbymichael/estim-web:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.estim.ai"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://app.estim.ai"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: estim-web
  namespace: estim-production
  labels:
    app: estim-web
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: estim-web
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estim-web-ingress
  namespace: estim-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - app.estim.ai
      secretName: estim-production-tls
  rules:
    - host: app.estim.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: estim-web
                port:
                  number: 80