apiVersion: apps/v1
kind: Deployment
metadata:
  name: estim-worker
  namespace: estim-production
  labels:
    app: estim-worker
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: estim-worker
  template:
    metadata:
      labels:
        app: estim-worker
        tier: worker
    spec:
      containers:
        - name: estim-worker
          image: ghcr.io/tabbymichael/estim-worker:latest
          envFrom:
            - configMapRef:
                name: estim-production-config
            - secretRef:
                name: estim-production-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: estim-production-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: estim-production-secrets
                  key: REDIS_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["celery", "-A", "app.worker.celery_app", "inspect", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: estim-worker
  namespace: estim-production
  labels:
    app: estim-worker
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: estim-worker