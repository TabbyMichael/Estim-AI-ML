apiVersion: apps/v1
kind: Deployment
metadata:
  name: estim-redis
  namespace: estim-production
  labels:
    app: estim-redis
    tier: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: estim-redis
  template:
    metadata:
      labels:
        app: estim-redis
        tier: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: estim-production-secrets
                  key: REDIS_PASSWORD
                  optional: true
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: redis-data
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "gp2"
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: estim-redis
  namespace: estim-production
  labels:
    app: estim-redis
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: estim-redis