[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql://estim:estim@localhost:5432/estim_ai

[loggers]
keys = root, alembic

[handlers]
keys = console

[formatters]
keys = console

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = console

[formatter_console]
format = %(levelname)-5.5s [%(name)s] %(message)s

