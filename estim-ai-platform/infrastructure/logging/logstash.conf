input {
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  mutate {
    add_field => { "service" => "estim-api" }
    add_field => { "environment" => "development" }
  }
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "estim-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}
