apiVersion: apps/v1
kind: Deployment
metadata:
  name: estim-api
  namespace: estim-production
  labels:
    app: estim-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: estim-api
  template:
    metadata:
      labels:
        app: estim-api
        tier: backend
        version: v1
    spec:
      containers:
        - name: estim-api
          image: ghcr.io/tabbymichael/estim-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: estim-production-config
            - secretRef:
                name: estim-production-secrets
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: estim-production-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: estim-production-secrets
                  key: REDIS_URL
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: estim-api
  namespace: estim-production
  labels:
    app: estim-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app: estim-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: estim-api-ingress
  namespace: estim-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.estim.ai
      secretName: estim-production-tls
  rules:
    - host: api.estim.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: estim-api
                port:
                  number: 80