version: '3.8'

services:
  # Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: estim-staging-postgres
    environment:
      POSTGRES_USER: estim
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-estim_password}
      POSTGRES_DB: estim_ai
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estim -d estim_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estim-network

  # Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: estim-staging-redis
    command: redis-server --requirepass ${STAGING_REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${STAGING_REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - estim-network

  # Object Storage
  minio:
    image: bitnami/minio:latest
    container_name: estim-staging-minio
    environment:
      MINIO_ROOT_USER: ${STAGING_MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STAGING_MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - staging_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - estim-network

  # MLflow
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: estim-staging-mlflow
    command: mlflow server \
      --backend-store-uri postgresql://estim:${STAGING_DB_PASSWORD:-estim_password}@postgres:5432/estim_ai \
      --default-artifact-root s3://estim-mlflow-artifacts \
      --host 0.0.0.0 \
      --port 5000
    environment:
      AWS_ACCESS_KEY_ID: ${STAGING_MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${STAGING_MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - estim-network

  # API Backend
  estim-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    container_name: estim-staging-api
    environment:
      APP_NAME: Estim AI Platform (Staging)
      DEBUG: "false"
      DATABASE_URL: postgresql://estim:${STAGING_DB_PASSWORD:-estim_password}@postgres:5432/estim_ai
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD:-redis_password}@redis:6379/0
      SECRET_KEY: ${STAGING_SECRET_KEY:-staging_secret_key_change_in_production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 15
      CORS_ORIGINS: https://staging.estim.ai
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${STAGING_MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${STAGING_MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      ODOO_URL: ${STAGING_ODOO_URL:-}
      ODOO_DB: ${STAGING_ODOO_DB:-}
      ODOO_USERNAME: ${STAGING_ODOO_USERNAME:-}
      ODOO_PASSWORD: ${STAGING_ODOO_PASSWORD:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - estim-network

  # Background Worker
  estim-worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    container_name: estim-staging-worker
    environment:
      DATABASE_URL: postgresql://estim:${STAGING_DB_PASSWORD:-estim_password}@postgres:5432/estim_ai
      REDIS_URL: redis://:${STAGING_REDIS_PASSWORD:-redis_password}@redis:6379/0
      SECRET_KEY: ${STAGING_SECRET_KEY:-staging_secret_key_change_in_production}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${STAGING_MINIO_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${STAGING_MINIO_SECRET_KEY:-minioadmin}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      estim-api:
        condition: service_healthy
    networks:
      - estim-network

  # Frontend
  estim-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: estim-staging-web
    environment:
      NEXT_PUBLIC_API_URL: https://staging-api.estim.ai
      NEXT_PUBLIC_APP_URL: https://staging.estim.ai
    ports:
      - "3000:3000"
    depends_on:
      estim-api:
        condition: service_healthy
    networks:
      - estim-network

  # Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: estim-staging-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./../../infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - staging_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - estim-network

  grafana:
    image: grafana/grafana:latest
    container_name: estim-staging-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${STAGING_GRAFANA_PASSWORD:-admin_password}
    volumes:
      - staging_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - estim-network

volumes:
  staging_postgres_data:
  staging_minio_data:
  staging_prometheus_data:
  staging_grafana_data:

networks:
  estim-network:
    driver: bridge