[tool.poetry]
name = "estim-ai-platform"
version = "0.1.0"
description = "Estim AI Platform - Construction Intelligence System"
authors = ["Estim Construction Tanzania"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"

# FastAPI and web
# FastAPI is capped below 0.142: from 0.142.0 onwards FastAPI hard-requires
# `opentelemetry-api>=1.44.0`, which is incompatible with the Jaeger Thrift
# exporter (see the OpenTelemetry block below).
fastapi = ">=0.110.0,<0.142.0"
starlette = ">=0.46.0,<1.0.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
python-multipart = "^0.0.9"

# Database
sqlalchemy = "^2.0.25"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"

# Redis and Celery
redis = "^5.0.1"
celery = "^5.3.6"

# ML
scikit-learn = "^1.4.0"
lightgbm = "^4.3.0"
xgboost = "^2.0.3"
torch = "^2.2.0"
sentence-transformers = "^2.3.1"
llama-index = "^0.9.0"

# Object storage
boto3 = "^1.34.0"
minio = "^7.2.0"

# MLflow
mlflow = "^2.11.0"

# Monitoring / Observability
prometheus-client = "^0.20.0"

# Distributed Tracing (OpenTelemetry + Jaeger)
#
# Exact pins, intentionally constrained:
#   * `opentelemetry-exporter-jaeger` is deprecated and its final release (1.21.0)
#     cannot satisfy `^1.28.0`. `opentelemetry-exporter-jaeger-thrift` is the
#     supported replacement and provides `opentelemetry.exporter.jaeger.thrift`.
#   * The Thrift exporter imports `OTEL_EXPORTER_JAEGER_AGENT_HOST` from the SDK;
#     that symbol was removed in opentelemetry-sdk 1.40.0, so the SDK is capped
#     at 1.39.x.
#   * The SDK pins `opentelemetry-api` to an exact version, and the instrumentation
#     package pins `opentelemetry-semantic-conventions`, which in turn pins the API
#     version. 1.39.0 / 0.60b0 is the newest combination keeping all four packages
#     mutually consistent.
#   * `Deprecated` is an *undeclared* runtime import of the Jaeger Thrift exporter
#     (absent from its metadata), so it must be required explicitly or importing
#     the exporter raises ModuleNotFoundError.
opentelemetry-api = "1.39.0"
opentelemetry-sdk = "1.39.0"
opentelemetry-exporter-jaeger-thrift = "1.21.0"
opentelemetry-instrumentation-fastapi = "0.60b0"
Deprecated = ">=1.2.14"
thrift = ">=0.10.0"

# Utilities
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-dotenv = "^1.0.1"
pytz = "^2024.1"
pandas = "^2.2.0"
numpy = "^1.26.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-asyncio = "^0.23.3"
pytest-cov = "^4.1.0"
httpx = ">=0.27.0,<0.29.0"

# Code quality
black = ">=24.1.1,<25.0.0"
# ruff >= 0.4.0 is required: earlier releases do not know the `UP042`
# selector that this project's ruff configuration references.
ruff = ">=0.4.0,<0.6.0"
mypy = ">=1.8.0,<2.0.0"

# Type stubs
types-redis = "^4.6.0"
types-python-jose = "^3.3.0"
types-passlib = "^1.7.0"
types-boto3 = "^1.34.0"

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.venv
  | venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # `(str, Enum)` is kept deliberately: `enum.StrEnum` changes `str(member)`
    # to the bare value, which alters how these enums serialise in logs and
    # API responses. Several call sites already carry `# noqa: UP042`.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
exclude = ["app/modules/.*/tests/", "^tests/"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "celery.*",
    "mlflow.*",
    "lightgbm.*",
    "xgboost.*",
    "sklearn.*",
    "sentence_transformers.*",
    "llama_index.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "app/modules"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
